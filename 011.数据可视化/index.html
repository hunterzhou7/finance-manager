<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人记账APP运营分析仪表盘</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .header {
      text-align: center;
      color: white;
      padding: 30px 0;
    }
    .header h1 { font-size: 2.5rem; margin-bottom: 10px; }
    .header p { opacity: 0.9; font-size: 1.1rem; }

    .stats-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    .stat-card {
      background: rgba(255,255,255,0.95);
      border-radius: 16px;
      padding: 25px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      transition: transform 0.3s;
    }
    .stat-card:hover { transform: translateY(-5px); }
    .stat-card .label { color: #666; font-size: 0.9rem; margin-bottom: 8px; }
    .stat-card .value { color: #333; font-size: 2rem; font-weight: bold; }
    .stat-card .value.blue { color: #667eea; }
    .stat-card .value.green { color: #27ae60; }
    .stat-card .value.orange { color: #e67e22; }
    .stat-card .value.purple { color: #9b59b6; }

    .charts-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }
    .chart-container {
      background: rgba(255,255,255,0.95);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }
    .chart-container.full-width { grid-column: 1 / -1; }
    .chart-title {
      font-size: 1.1rem;
      color: #333;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 2px solid #eee;
    }
    .chart { width: 100%; height: 350px; }

    @media (max-width: 1200px) {
      .charts-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>个人记账APP运营分析仪表盘</h1>
    <p>数据来源：个人记账APP运营分析数据.xlsx</p>
  </div>

  <div class="stats-cards">
    <div class="stat-card">
      <div class="label">总用户数</div>
      <div class="value blue" id="totalUsers">-</div>
    </div>
    <div class="stat-card">
      <div class="label">总记录数</div>
      <div class="value green" id="totalRecords">-</div>
    </div>
    <div class="stat-card">
      <div class="label">总收入</div>
      <div class="value orange" id="totalIncome">-</div>
    </div>
    <div class="stat-card">
      <div class="label">总支出</div>
      <div class="value purple" id="totalExpense">-</div>
    </div>
  </div>

  <div class="charts-grid">
    <!-- 月度趋势折线图 -->
    <div class="chart-container full-width">
      <div class="chart-title">📈 月度收支趋势（折线图）</div>
      <div class="chart" id="trendChart"></div>
    </div>

    <!-- 城市分布柱状图 -->
    <div class="chart-container">
      <div class="chart-title">🏙️ 各城市消费排行（柱状图）</div>
      <div class="chart" id="cityChart"></div>
    </div>

    <!-- 支付���式饼图 -->
    <div class="chart-container">
      <div class="chart-title">💳 支付方式分布（饼图）</div>
      <div class="chart" id="paymentChart"></div>
    </div>

    <!-- 支出分类饼图 -->
    <div class="chart-container">
      <div class="chart-title">🍔 支出分类占比（饼图）</div>
      <div class="chart" id="expenseCategoryChart"></div>
    </div>

    <!-- 收入分类饼图 -->
    <div class="chart-container">
      <div class="chart-title">💰 收入分类占比（饼图）</div>
      <div class="chart" id="incomeCategoryChart"></div>
    </div>

    <!-- 会员类型柱状图 -->
    <div class="chart-container">
      <div class="chart-title">👥 用户类型分布（柱状图）</div>
      <div class="chart" id="memberChart"></div>
    </div>

    <!-- 收支对比雷达图 -->
    <div class="chart-container">
      <div class="chart-title">🎯 收支对比分析（雷达图）</div>
      <div class="chart" id="radarChart"></div>
    </div>
  </div>

  <script>
    // Chart data
    const chartData = {
      "monthly": {
        "2026-01": {"income": 362000, "expense": 47590.91},
        "2026-02": {"income": 224400, "expense": 42199.85},
        "2026-03": {"income": 238200, "expense": 21900.05},
        "2026-04": {"income": 346700, "expense": 40654.11},
        "2026-05": {"income": 290800, "expense": 37275.96}
      },
      "city": {"上海": 374091.03, "杭州": 352264.29, "成都": 349589.67, "北京": 347944.33, "深圳": 346258.81, "广州": 309517.44, "武汉": 254610.52, "西安": 212855.71},
      "payment": {"支付宝": 451474.43, "微信": 430271.52, "银行卡": 418826.57, "现金": 381200.64, "信用卡": 362923.76},
      "member": {"免费用户": 169, "年会员": 169, "月会员": 162},
      "category_expense": {"社交": 26851.17, "旅游": 21308.45, "餐饮": 18330.47, "数码": 18231.48, "购物": 17339.13, "住房": 9421.74, "交通": 17318.67, "医疗": 6938.99, "教育": 5695.66, "其他": 14959.22},
      "category_income": {"兼职": 644600, "投资收益": 609600, "工资": 570200},
      "ops": {"总用户数": 99, "总记录数": 500, "总收入": 1824400}
    };

    // Format number
    const fmt = (n) => n >= 10000 ? (n/10000).toFixed(1) + '万' : n.toFixed(0);

    // Set stat cards
    document.getElementById('totalUsers').textContent = chartData.ops['总用户数'];
    document.getElementById('totalRecords').textContent = chartData.ops['总记录数'];
    document.getElementById('totalIncome').textContent = '¥' + fmt(chartData.ops['总收入']);
    const totalExpense = Object.values(chartData.category_expense).reduce((a,b)=>a+b, 0);
    document.getElementById('totalExpense').textContent = '¥' + fmt(totalExpense);

    // Colors
    const colors = {
      income: '#27ae60',
      expense: '#e74c3c',
      blue: '#667eea',
      purple: '#9b59b6',
      orange: '#e67e22'
    };
    const categoryColors = ['#667eea', '#f093fb', '#f5576c', '#4facfe', '#00f2fe', '#43e97b', '#38f9d7', '#fa709a', '#fee140', '#fcb902'];

    // 1. Trend Chart (Line)
    const trendChart = echarts.init(document.getElementById('trendChart'));
    const months = Object.keys(chartData.monthly);
    const incomes = months.map(m => chartData.monthly[m].income);
    const expenses = months.map(m => chartData.monthly[m].expense);
    trendChart.setOption({
      tooltip: { trigger: 'axis', formatter: '{b}<br/>收入: ¥{c}<br/>支出: ¥{c1}' },
      legend: { data: ['收入', '支出'], bottom: 0 },
      grid: { left: '3%', right: '4%', bottom: '15%', top: '10%', containLabel: true },
      xAxis: { type: 'category', data: months, axisLine: { lineStyle: { color: '#999' } } },
      yAxis: { type: 'value', axisLine: { lineStyle: { color: '#999' } }, splitLine: { lineStyle: { type: 'dashed' } } },
      series: [
        { name: '收入', type: 'line', data: incomes, smooth: true, lineStyle: { color: colors.income, width: 3 }, itemStyle: { color: colors.income }, areaStyle: { color: new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'rgba(39,174,96,0.3)'},{offset:1,color:'rgba(39,174,96,0.05)'}]) } },
        { name: '支出', type: 'line', data: expenses, smooth: true, lineStyle: { color: colors.expense, width: 3 }, itemStyle: { color: colors.expense }, areaStyle: { color: new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'rgba(231,76,60,0.3)'},{offset:1,color:'rgba(231,76,60,0.05)'}]) } }
      ]
    });

    // 2. City Chart (Bar)
    const cityChart = echarts.init(document.getElementById('cityChart'));
    const cities = Object.keys(chartData.city).slice(0, 8);
    const cityValues = cities.map(c => chartData.city[c]);
    cityChart.setOption({
      tooltip: { trigger: 'axis', formatter: '{b}: ¥{c}' },
      grid: { left: '3%', right: '4%', bottom: '3%', top: '3%', containLabel: true },
      xAxis: { type: 'value', axisLine: { lineStyle: { color: '#999' } }, splitLine: { lineStyle: { type: 'dashed' } } },
      yAxis: { type: 'category', data: cities.reverse(), axisLine: { lineStyle: { color: '#999' } } },
      series: [{ type: 'bar', data: cityValues.reverse(), itemStyle: { color: new echarts.graphic.LinearGradient(0,0,1,0,[{offset:0,color:'#667eea'},{offset:1,color:'#764ba2'}]) }, barWidth: 20 }]
    });

    // 3. Payment Chart (Pie)
    const paymentChart = echarts.init(document.getElementById('paymentChart'));
    const paymentData = Object.entries(chartData.payment).map(([name, value]) => ({ name, value }));
    paymentChart.setOption({
      tooltip: { trigger: 'item', formatter: '{b}: ¥{c} ({d}%)' },
      legend: { orient: 'vertical', right: '5%', top: 'center' },
      series: [{
        type: 'pie', radius: ['40%', '70%'], center: ['40%', '50%'],
        itemStyle: { borderRadius: 8, borderColor: '#fff', borderWidth: 2 },
        label: { show: true, formatter: '{b}\n{d}%' },
        data: paymentData,
        color: ['#667eea', '#f093fb', '#f5576c', '#4facfe', '#00f2fe']
      }]
    });

    // 4. Expense Category Chart (Pie)
    const expenseChart = echarts.init(document.getElementById('expenseCategoryChart'));
    const expenseData = Object.entries(chartData.category_expense).map(([name, value]) => ({ name, value }));
    expenseChart.setOption({
      tooltip: { trigger: 'item', formatter: '{b}: ¥{c} ({d}%)' },
      legend: { orient: 'vertical', right: '5%', top: 'center' },
      series: [{
        type: 'pie', radius: ['40%', '70%'], center: ['40%', '50%'],
        itemStyle: { borderRadius: 8, borderColor: '#fff', borderWidth: 2 },
        label: { show: true, formatter: '{b}\n{d}%' },
        roseType: 'radius',
        data: expenseData,
        color: categoryColors
      }]
    });

    // 5. Income Category Chart (Pie)
    const incomeChart = echarts.init(document.getElementById('incomeCategoryChart'));
    const incomeData = Object.entries(chartData.category_income).map(([name, value]) => ({ name, value }));
    incomeChart.setOption({
      tooltip: { trigger: 'item', formatter: '{b}: ¥{c} ({d}%)' },
      legend: { orient: 'vertical', right: '5%', top: 'center' },
      series: [{
        type: 'pie', radius: ['40%', '70%'], center: ['40%', '50%'],
        itemStyle: { borderRadius: 8, borderColor: '#fff', borderWidth: 2 },
        label: { show: true, formatter: '{b}\n{d}%' },
        data: incomeData,
        color: ['#27ae60', '#2ecc71', '#82e0aa']
      }]
    });

    // 6. Member Chart (Bar)
    const memberChart = echarts.init(document.getElementById('memberChart'));
    const memberData = Object.entries(chartData.member);
    memberChart.setOption({
      tooltip: { trigger: 'axis', formatter: '{b}: {c}人' },
      grid: { left: '3%', right: '4%', bottom: '3%', top: '3%', containLabel: true },
      xAxis: { type: 'category', data: memberData.map(d => d[0]), axisLine: { lineStyle: { color: '#999' } } },
      yAxis: { type: 'value', axisLine: { lineStyle: { color: '#999' } }, splitLine: { lineStyle: { type: 'dashed' } } },
      series: [{ type: 'bar', data: memberData.map(d => d[1]), itemStyle: { color: new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'#667eea'},{offset:1,color:'#764ba2'}]) }, barWidth: 40 }]
    });

    // 7. Radar Chart
    const radarChart = echarts.init(document.getElementById('radarChart'));
    const topCategories = Object.keys(chartData.category_expense).slice(0, 6);
    const radarData = topCategories.map(cat => chartData.category_expense[cat] || 0);
    const incomeRadar = Object.keys(chartData.category_income).map(cat => chartData.category_income[cat] || 0);
    radarChart.setOption({
      tooltip: {},
      legend: { data: ['支出', '收入'], bottom: 0 },
      radar: {
        indicator: [...topCategories.map(c => ({ name: c }))],
        radius: '60%',
        axisName: { color: '#666' },
        splitArea: { areaStyle: { color: ['#f8f9fa', '#fff'] } }
      },
      series: [{
        type: 'radar',
        data: [
          { value: radarData, name: '支出', itemStyle: { color: colors.expense }, areaStyle: { opacity: 0.3 } },
          { value: incomeRadar.slice(0, 6), name: '收入', itemStyle: { color: colors.income }, areaStyle: { opacity: 0.3 } }
        ]
      }]
    });

    // Responsive resize
    window.addEventListener('resize', () => {
      trendChart.resize();
      cityChart.resize();
      paymentChart.resize();
      expenseChart.resize();
      incomeChart.resize();
      memberChart.resize();
      radarChart.resize();
    });
  </script>
</body>
</html>
